name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log

      - name: Show real error if build failed
        if: steps.build.outcome == 'failure'
        run: |
          grep -E "^e: |error:|What went wrong" build_output.log > errors_only.log || true
          if [ -s errors_only.log ]; then
            MSG=$(cat errors_only.log | tail -c 3800 | perl -pe 's/\n/%0A/g; s/\r/%0D/g')
          else
            MSG=$(tail -c 3800 build_output.log | perl -pe 's/\n/%0A/g; s/\r/%0D/g')
          fi
          echo "::error::$MSG"
          exit 1

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BookTecaPX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload full build log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: build_output.log
